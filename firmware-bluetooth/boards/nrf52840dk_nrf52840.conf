# Board-specific overrides for the nRF52840 DK (PCA10056).
#
# Unlike the Seeed Xiao / Adafruit Feather (which ship a UF2 bootloader at
# flash offset 0x0), a bare DK has no bootloader. The default
# CONFIG_USE_DT_CODE_PARTITION=y links the app into slot0_partition (0xc000),
# which only boots if a bootloader at 0x0 jumps to it. Disabling it links the
# app at 0x0 so it boots standalone after a plain `west flash` / J-Link load.
CONFIG_USE_DT_CODE_PARTITION=n
