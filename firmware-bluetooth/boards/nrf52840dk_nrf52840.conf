# Board-specific overrides for the nRF52840 DK (PCA10056).
#
# Unlike the Seeed Xiao / Adafruit Feather (which ship a UF2 bootloader at
# flash offset 0x0), a bare DK has no bootloader. The default
# CONFIG_USE_DT_CODE_PARTITION=y links the app into slot0_partition (0xc000),
# which only boots if a bootloader at 0x0 jumps to it. Disabling it links the
# app at 0x0 so it boots standalone after a plain `west flash` / J-Link load.
CONFIG_USE_DT_CODE_PARTITION=n

# Force the debug access port open on every boot. A bare DK has no UF2
# bootloader to keep APPROTECT disabled (the Seeed/Feather bootloaders do),
# so with the default USE_UICR=y the chip comes up secured and J-Link can
# only reconnect via a mass-erase — an endless "device is secured" loop.
# USE_UICR=n makes the SoC startup unconditionally write APPROTECT.DISABLE,
# keeping SWD debug available after every reset.
CONFIG_NRF_APPROTECT_USE_UICR=n

# Switch 2 console USB build: a single HID interface (the gamepad) so the
# composite Switch 2 Pro path compiles. Everything gated on
# CONFIG_USB_HID_DEVICE_COUNT == 1 (force descriptor 7, the vendor BULK
# interface + 0x91 handshake, the composite device-class override) is OFF at
# the default count of 2 — which left the DK enumerating as a plain remapper.
# Config protocol is served over the switch2 HID interface in this mode.
CONFIG_USB_HID_DEVICE_COUNT=1

# Real Switch 2 Pro uses EP interval=4 (4ms); Zephyr default is 1ms.
CONFIG_USB_HID_POLL_INTERVAL_MS=4
